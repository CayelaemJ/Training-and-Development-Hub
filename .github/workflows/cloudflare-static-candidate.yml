name: Cloudflare Direct Upload candidate - CABO Learning Hub

# No Cloudflare GitHub App integration or Cloudflare token required to verify the build.
# Do not publish the frontend alone: auth and backend APIs are not yet migrated.
on:
  push:
    branches: [chore/cloudflare-direct-upload-20261028]
  pull_request:
    branches: [feat/learner-success-loop]

permissions:
  contents: read

jobs:
  static-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate (no deployment or production data)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          node --test scripts/cloudflare/oidc-origin.test.mjs
          pnpm run typecheck:libs
          pnpm --filter @workspace/training-platform run typecheck
          PORT=10000 BASE_PATH=/ pnpm --filter @workspace/training-platform run build
          test -s artifacts/training-platform/dist/public/index.html
      - name: Store static candidate for security review
        uses: actions/upload-artifact@v4
        with:
          name: cabo-learning-static-candidate
          path: artifacts/training-platform/dist/public/
          retention-days: 7
