name: CABO native Windows installer
# Builds the Release x64 Windows client, checks that no isolated-test sign-in
# code is compiled in, produces an Inno Setup .exe installer, then installs,
# starts and uninstalls it on the runner. Signs only when the owner has
# configured both certificate secrets; otherwise outputs are UNSIGNED and must
# not be distributed. Runs on pull requests that change the installer (as a
# build check) and manually for release candidates. Nothing is published.
on:
  pull_request:
    paths:
      - 'native-apps/windows/**'
      - '.github/workflows/native-windows-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 or 0.2.0-rc.1"
        required: true
permissions:
  contents: read
concurrency:
  group: native-windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      INSTALL_DIR_NAME: CABO Learning Hub
      UNINSTALL_KEY: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F4C2B1E-8A3D-4C7B-9E21-CAB0C0DE2026}_is1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } else { "0.0.0-pr$($env:PR_NUMBER)" }
          if ($version -notmatch '^(\d+\.\d+\.\d+)(?:-([A-Za-z0-9.]+))?$') { throw "Invalid version '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prefix=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "suffix=$($Matches[2])" >> $env:GITHUB_OUTPUT

      - name: Build Release x64 (test sign-in disabled)
        shell: pwsh
        env:
          PREFIX: ${{ steps.version.outputs.prefix }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          msbuild native-apps/windows/CABO.Native/CABO.Native.csproj -t:Rebuild -restore `
            -p:Configuration=Release -p:Platform=x64 -p:CaboIsolatedTestBuild=false `
            "-p:VersionPrefix=$env:PREFIX" "-p:VersionSuffix=$env:SUFFIX" -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Locate build and verify no isolated-test code is compiled in
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem native-apps/windows/CABO.Native/bin -Recurse -Filter CABO.Native.exe -File |
            Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $exe) { throw "Release CABO.Native.exe not found" }
          $dir = $exe.Directory.FullName
          $dll = Join-Path $dir 'CABO.Native.dll'
          if (-not (Test-Path $dll)) { throw "CABO.Native.dll not found next to the executable" }
          # .NET string literals are stored as UTF-16LE; search both byte alignments.
          function Test-Literal([string]$path, [string]$text) {
            $bytes = [IO.File]::ReadAllBytes($path)
            foreach ($offset in 0, 1) {
              $decoded = [Text.Encoding]::Unicode.GetString($bytes, $offset, $bytes.Length - $offset)
              if ($decoded.Contains($text)) { return $true }
            }
            return $false
          }
          # Positive control: the production origin literal must be found, proving the scan works.
          if (-not (Test-Literal $dll 'cabo-learning-hub-pilot.onrender.com')) { throw "Scanner control failed: production origin literal not found" }
          if (Test-Literal $dll 'CABO_ISOLATED_TEST_ORIGIN') { throw "Release build contains isolated-test sign-in code" }
          Write-Output "Release build verified: no isolated-test sign-in code. Folder: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup if missing
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Output "Using $iscc ($((Get-Item $iscc).VersionInfo.ProductVersion))"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Prepare signing certificate from secrets (if configured)
        id: signing
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.CABO_WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CABO_WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $present = @($env:CERT_B64, $env:CERT_PASSWORD | Where-Object { $_ }).Count
          if ($present -eq 0) { "signed=false" >> $env:GITHUB_OUTPUT; exit 0 }
          if ($present -ne 2) { throw "Configure both Windows signing secrets or neither." }
          $pfx = Join-Path $env:RUNNER_TEMP 'cabo-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "signed=true" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT

      - name: Sign application executable (if configured)
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CABO_WINDOWS_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          PFX: ${{ steps.signing.outputs.pfx }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:PFX /p $env:CERT_PASSWORD `
            (Join-Path $env:BUILD_DIR 'CABO.Native.exe') (Join-Path $env:BUILD_DIR 'CABO.Native.dll')
          if ($LASTEXITCODE -ne 0) { throw "Signing the application failed" }

      - name: Build installer
        id: installer
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $label = if ($env:SIGNED -eq 'true') { 'signed' } else { 'UNSIGNED-do-not-distribute' }
          $name = "CABO-Learning-Hub-Setup-$env:VERSION-x64-$label"
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DSourceDir=$env:BUILD_DIR" "/DOutputName=$name" native-apps/windows/installer/CABO.Native.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $setup = "native-apps/windows/installer/output/$name.exe"
          if (-not (Test-Path $setup)) { throw "Installer not produced" }
          "setup=$((Resolve-Path $setup).Path)" >> $env:GITHUB_OUTPUT

      - name: Sign installer (if configured)
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CABO_WINDOWS_CERT_PASSWORD }}
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          PFX: ${{ steps.signing.outputs.pfx }}
          SETUP: ${{ steps.installer.outputs.setup }}
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:PFX /p $env:CERT_PASSWORD $env:SETUP
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed" }

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'cabo-signing.pfx')

      - name: Install, start and uninstall on the runner
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\$env:INSTALL_DIR_NAME"
          $exe = Join-Path $appDir 'CABO.Native.exe'
          $log = Join-Path $env:RUNNER_TEMP 'cabo-install.log'
          $p = Start-Process -FilePath $env:SETUP -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "Installed executable missing at $exe" }
          if (-not (Test-Path $env:UNINSTALL_KEY)) { throw "Uninstall registration missing" }
          Write-Output "PASS install: $exe and uninstall registration present"

          # Startup check (informational: hosted runners have no interactive user session).
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $app.HasExited
          $startup = if ($alive) { 'still running after 15 s' } else { "exited with code $($app.ExitCode)" }
          if ($alive) { Stop-Process -Id $app.Id -Force }
          Write-Output "INFO startup: $startup"
          "Startup check on hosted runner (informational, not a pass/fail gate): **$startup**" >> $env:GITHUB_STEP_SUMMARY

          # Uninstall must remove program files and the local sign-in token.
          $tokenDir = Join-Path $env:LOCALAPPDATA 'CABO\LearningHub'
          New-Item -ItemType Directory -Force $tokenDir | Out-Null
          Set-Content -Path (Join-Path $tokenDir 'native-session.bin') -Value 'synthetic-test-token'
          $uninstaller = Join-Path $appDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The Inno uninstaller relaunches itself from a temp copy, so poll for completion.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw "Uninstall did not remove $exe" }
          while ((Test-Path $env:UNINSTALL_KEY) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $env:UNINSTALL_KEY) { throw "Uninstall registration still present" }
          if (Test-Path (Join-Path $tokenDir 'native-session.bin')) { throw "Local sign-in token not removed on uninstall" }
          Write-Output "PASS uninstall: program files, registration and local sign-in token removed"

      - name: Checksums
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:SETUP).Hash.ToLower()
          "$hash  $(Split-Path $env:SETUP -Leaf)" | Set-Content native-apps/windows/installer/output/SHA256SUMS.txt
          Get-Content native-apps/windows/installer/output/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CABO-Windows-installer-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: native-apps/windows/installer/output/
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}
          if-no-files-found: error
# A signed installer from this workflow is a release CANDIDATE only: physical
# school-device testing, sign-in verification and owner approval are still
# required before distribution.
