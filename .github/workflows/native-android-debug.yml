name: CABO native Android emulator tests and debug APK
on:
  pull_request:
    paths:
      - 'native-apps/android/**'
      - 'native-apps/ios/**'
      - 'native-apps/SELF_HOSTED_CHECKS.md'
      - '.github/workflows/native-android-debug.yml'
      - '.github/workflows/native-ios-verify.yml'
  push:
    branches: [main]
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/native-android-debug.yml'
  workflow_dispatch:
jobs:
  android-tests:
    runs-on: ${{ fromJSON(vars.CABO_ANDROID_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Android emulator host virtualization
        if: contains(fromJSON(vars.CABO_ANDROID_RUNNER_LABELS || '["ubuntu-latest"]'), 'self-hosted')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'This Android self-hosted runner needs readable and writable /dev/kvm for hardware-accelerated emulation.' >&2
            ls -l /dev/kvm 2>/dev/null || true
            exit 1
          fi
      # GitHub-hosted Ubuntu runners expose /dev/kvm but not to the runner user.
      # Without this the emulator action disables acceleration and the emulator
      # refuses to start ("Software CPU emulation (-accel off) is not supported"),
      # which is what failed every android-tests run on 2026-11-22.
      - name: Enable KVM for the emulator on GitHub-hosted runners
        if: ${{ !contains(fromJSON(vars.CABO_ANDROID_RUNNER_LABELS || '["ubuntu-latest"]'), 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || { echo "::error::/dev/kvm is still not accessible"; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true
      - name: Verify official Gradle wrapper JAR
        run: echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  native-apps/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --status
      - name: Run UI tests on minimum-supported Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: Nexus 5X
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: native-apps/android
          script: >-
            ./gradlew :app:connectedDebugAndroidTest :app:assembleDemo --no-daemon --stacktrace
            && bash verify-demo-apk.sh app/build/outputs/apk/demo/app-demo.apk
      - name: Package verified Android demo APK
        working-directory: native-apps/android
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/demo/app-demo.apk app/build/ci-artifacts/cabo-learning-hub-demo.apk
      - name: Upload verified Android demo APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CABO-Android-Demo-APK
          path: native-apps/android/app/build/ci-artifacts/cabo-learning-hub-demo.apk
          retention-days: 14
          if-no-files-found: error
  android-build:
    runs-on: ${{ fromJSON(vars.CABO_ANDROID_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true
      - name: Verify official Gradle wrapper JAR
        run: echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  native-apps/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --status
      - name: Build standard unsigned-for-release debug APK
        working-directory: native-apps/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ci-artifacts/cabo-native-android-debug.apk
      - name: Upload standard Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CABO-native-Android-DEBUG-test-only
          path: native-apps/android/app/build/ci-artifacts/cabo-native-android-debug.apk
          retention-days: 3
          if-no-files-found: error
  android-release:
    runs-on: ${{ fromJSON(vars.CABO_ANDROID_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true
      - name: Verify official Gradle wrapper JAR
        run: echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  native-apps/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --status
      - name: Run JVM unit tests
        working-directory: native-apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Run Android lint (static analysis)
        working-directory: native-apps/android
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace
      - name: Prepare optional release signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CABO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CABO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CABO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CABO_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64}" && -n "${STORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            umask 077
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/cabo-release.jks"
            echo "path=${RUNNER_TEMP}/cabo-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets are not all configured; building unsigned release artifacts." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK and Android App Bundle
        working-directory: native-apps/android
        env:
          CABO_ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          CABO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CABO_ANDROID_KEYSTORE_PASSWORD }}
          CABO_ANDROID_KEY_ALIAS: ${{ secrets.CABO_ANDROID_KEY_ALIAS }}
          CABO_ANDROID_KEY_PASSWORD: ${{ secrets.CABO_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace \
            -PcaboVersionCode=${{ github.run_number }}
      - name: Verify release outputs
        working-directory: native-apps/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-release
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$aab" | grep -q 'base/manifest/AndroidManifest.xml'
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then suffix=signed; else suffix=UNSIGNED; fi
          cp "$apk" "app/build/ci-release/cabo-native-android-release-${suffix}.apk"
          cp "$aab" "app/build/ci-release/cabo-native-android-release-${suffix}.aab"
          ls -l app/build/ci-release | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove decoded signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/cabo-release.jks"
      - name: Upload release APK and AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CABO-native-Android-RELEASE-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: native-apps/android/app/build/ci-release/
          retention-days: 7
          if-no-files-found: error
# The debug and demo APKs use generated debug signing keys for internal testing.
# The demo APK uses fictional fixtures and has no Internet permission.
# The release job never publishes to Google Play. Unsigned outputs must be signed before any distribution;
# signing material is read only from repository secrets and the decoded keystore is deleted after use.
