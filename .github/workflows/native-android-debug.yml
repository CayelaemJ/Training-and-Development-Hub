name: CABO native Android debug APK (manual)
on:
  pull_request:
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/native-android-debug.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already contains Android command-line tools.
      # setup-android@v3 currently tries to install removed SDK package "tools".
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdkroot/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$manager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true
      - name: Compile native Android Kotlin app
        working-directory: native-apps/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload TEST-ONLY unsigned-for-release APK
        uses: actions/upload-artifact@v4
        with:
          name: CABO-native-Android-DEBUG-test-only
          path: native-apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
# Debug APK is signed with Android's generated DEBUG key, not CABO's Play Store
# release signing identity. Never redistribute it as a production school app.
