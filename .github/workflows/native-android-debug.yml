name: CABO native Android debug APK (manual)
on:
  pull_request:
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/native-android-debug.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK for Compose
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: true
      - name: Compile native Android Kotlin app
        working-directory: native-apps/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload TEST-ONLY unsigned-for-release APK
        uses: actions/upload-artifact@v4
        with:
          name: CABO-native-Android-DEBUG-test-only
          path: native-apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
# Debug APK is signed with Android's generated DEBUG key, not CABO's Play Store
# release signing identity. Never redistribute it as a production school app.
