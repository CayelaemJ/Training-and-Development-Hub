name: CABO native Windows build verification
on:
  pull_request:
    paths:
      - 'native-apps/windows/**'
      - '.github/workflows/native-windows-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore WinUI 3 dependencies
        shell: pwsh
        run: dotnet restore native-apps/windows/CABO.Native/CABO.Native.csproj
      - name: Compile native Windows x64 debug client
        shell: pwsh
        run: dotnet build native-apps/windows/CABO.Native/CABO.Native.csproj --no-restore -c Debug -p:Platform=x64
      - name: Validation boundary
        shell: pwsh
        run: Write-Output 'Build validation only; no signing, physical Windows lab run, MSIX, or native authentication verified.'
