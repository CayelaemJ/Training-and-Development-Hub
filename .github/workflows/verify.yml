name: Verify training hub
on:
  pull_request:
  push:
    branches: [main, feature/ai-written-examinations]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test artifacts/api-server/src/tests/consentPolicy.test.mjs artifacts/api-server/src/tests/hierarchyPolicy.test.mjs artifacts/api-server/src/tests/platformPolicy.test.mjs artifacts/api-server/src/tests/careerPolicy.test.mjs artifacts/api-server/src/tests/testPrincipals.test.mjs
      - run: pnpm run typecheck
      - run: pnpm run build
        env:
          PORT: "5000"
          BASE_PATH: "/"
