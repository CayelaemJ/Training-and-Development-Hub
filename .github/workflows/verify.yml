name: Verify training hub
on:
  pull_request:
  push:
    branches: [main, feature/ai-written-examinations]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test artifacts/api-server/src/tests/*.test.mjs
      - run: node scripts/test-learner-support.mjs
      - run: node scripts/test-uploads.mjs
      - run: node scripts/test-passport.mjs
      - run: node scripts/test-demo-admissions.mjs
      - name: Verify isolated native demo scripts
        run: |
          bash -n scripts/render-native-test-start.sh
          node --check lib/db/scripts/native-test-db-guard.mjs
          node --check scripts/smoke-native-test-login.mjs
          node --check scripts/smoke-native-parent-fixture.mjs
          node --check scripts/smoke-native-parent-school-review.mjs
          node --check scripts/native-preview-pending.mjs
      - run: pnpm run typecheck
      - run: pnpm run build
        env:
          PORT: "5000"
          BASE_PATH: "/"
      - name: Install browser runtime
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium
      - name: Browser and mobile release checks
        run: |
          node scripts/run-learner-success-browser.mjs
          node scripts/run-learner-success-browser.mjs --pwa
          node scripts/run-learner-success-browser.mjs --admissions
