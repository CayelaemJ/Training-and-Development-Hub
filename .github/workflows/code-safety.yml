name: Learning Hub code safety
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-hub-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, policy tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run learning policy regression tests
        run: node --test artifacts/api-server/src/tests/consentPolicy.test.mjs artifacts/api-server/src/tests/hierarchyPolicy.test.mjs artifacts/api-server/src/tests/platformPolicy.test.mjs artifacts/api-server/src/tests/careerPolicy.test.mjs artifacts/api-server/src/tests/testPrincipals.test.mjs
      - name: Check all TypeScript workspaces
        run: pnpm run typecheck
      - name: Verify production build
        run: pnpm run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  secrets:
    name: Scan leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar --no-same-owner -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan git history for leaked secrets
        run: gitleaks git --redact --exit-code 1

  static-security:
    name: Semgrep static security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Scan source for security vulnerabilities
        run: semgrep scan --config p/javascript --config p/typescript --error --exclude node_modules --exclude dist --exclude build .
