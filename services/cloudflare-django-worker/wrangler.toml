name = "cabo-learning-django-insights-staging"
main = "main.py"
# Pinned Wrangler 4.151.3 supports compatibility date 2026-10-26.
# Local Python WSGI HTTP smoke tests passed with this date.
compatibility_date = "2026-10-26"
compatibility_flags = ["python_workers"]

# No route or custom domain is attached. Deploy to isolated staging first.
# Set DJANGO_SECRET_KEY and DJANGO_WORKER_TOKEN as Worker secrets.
# This worker is not intended for direct browser use.
# Confirmed account workers.dev subdomain: cabo-solutions-za.
[vars]
DJANGO_ALLOWED_HOST = "cabo-learning-django-insights-staging.cabo-solutions-za.workers.dev"
