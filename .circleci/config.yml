version: 2.1
jobs:
  build_and_typecheck:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Enable pinned pnpm
          command: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Build and validate TypeScript
          command: pnpm run build
  semgrep:
    docker:
      - image: python:3.12-slim
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Semgrep
          command: pip install --no-cache-dir semgrep
      - run:
          name: Security scan
          command: semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --exclude node_modules --exclude dist --exclude build .
workflows:
  validate:
    jobs:
      - build_and_typecheck
      - semgrep
