version: 2.1
# One job, one install, no production secrets or automatic merges.
jobs:
  verify:
    docker:
      - image: node:24-bookworm
    resource_class: small
    steps:
      - checkout
      - run:
          name: Scan tracked files for high-confidence secrets and test detection
          command: node --test scripts/security/scan-secrets.test.mjs && node scripts/security/scan-secrets.mjs
      - run:
          name: Install pinned workspace tooling
          command: |
            npm install --global pnpm@10.28.2
            pnpm install --frozen-lockfile
      - run:
          name: Policy, isolation, migration and success-loop tests
          command: |
            node --test artifacts/api-server/src/tests/*.test.mjs
            node scripts/test-learner-support.mjs
            node scripts/test-uploads.mjs
      - run:
          name: Typecheck and build all workspaces
          command: pnpm run build
          environment:
            PORT: "5000"
            BASE_PATH: "/"
      - run:
          name: Browser, mobile and accessibility release checks
          command: |
            pnpm --filter @workspace/scripts exec playwright install --with-deps chromium
            mkdir -p test-results/browser
            CABO_UI_SCREENSHOT=test-results/browser/learner-dna-mobile.png node scripts/run-learner-success-browser.mjs
            node scripts/run-learner-success-browser.mjs --pwa
      - store_artifacts:
          path: test-results
  security_suite:
    docker:
      - image: cimg/go:1.24
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Python runtime and prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv curl
            python3 -m venv "$HOME/security-venv"
            echo 'export PATH="$HOME/security-venv/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Semgrep, Gitleaks, Trivy, optional Nuclei and Schemathesis
          command: bash .circleci/security.sh
          no_output_timeout: 15m
      - store_artifacts:
          path: security-reports
          destination: security-reports
  zap_baseline:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Require explicitly approved staging target
          command: |
            if [ "${SECURITY_ZAP_APPROVED:-}" != "YES_STAGING_ONLY" ] || [ -z "${SECURITY_ZAP_TARGET_URL:-}" ]; then
              echo "ZAP baseline skipped until a staging target is explicitly approved."
              circleci-agent step halt
            fi
            case "$SECURITY_ZAP_TARGET_URL" in
              https://*staging*|https://*test*|https://*preview*) ;;
              *) echo "Refusing target without staging/test/preview hostname"; exit 2;;
            esac
      - setup_remote_docker
      - run:
          name: Passive OWASP ZAP baseline
          command: |
            docker run --rm ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "$SECURITY_ZAP_TARGET_URL" -m 1 -I
          no_output_timeout: 15m

workflows:
  release_checks:
    jobs:
      - verify

  security_audit:
    jobs:
      - zap_baseline:
          filters:
            branches:
              only: main
      - security_suite
